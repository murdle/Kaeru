# Fabrique l'installateur Windows et publie la version sur GitHub Releases.
# Lancement : onglet Actions > « Fabriquer Kaeru » > Run workflow (ou en poussant un tag v1.2.3).
name: Fabriquer Kaeru
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
